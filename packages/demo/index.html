<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mpeg2toh264 demo</title>
    <style>
      #video {
        display: block;
        width: 100%;
        max-width: 100%;
      }
      #picture {
        position: relative;
        width: fit-content;
        max-width: 100%;
      }
      #playback {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5em;
      }
      #seek {
        flex: 1 1 20em;
        min-width: 0;
      }
      #playpause {
        width: 3em;
      }
      #url-form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5em;
      }
      #url {
        flex: 1 1 30em;
      }
      #stage:fullscreen {
        position: relative;
        background: black;
      }
      #stage:fullscreen > #picture {
        position: absolute;
        inset: 0;
        width: min(100vw, var(--picture-width, 177.77778vh));
        height: auto;
        margin: auto;
        aspect-ratio: var(--picture-aspect, 1.7777778);
      }
      #stage:fullscreen #picture > div {
        display: block !important;
        width: 100%;
        height: 100%;
      }
      #stage:fullscreen #video {
        width: 100%;
        height: 100%;
      }
      #stage:fullscreen #playback {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 2em 1em 1em;
        color: white;
        background: linear-gradient(transparent, rgb(0 0 0 / 80%));
        opacity: 0;
        transition: opacity 150ms ease;
      }
      #stage:fullscreen #playback:hover,
      #stage:fullscreen #playback:focus-within {
        opacity: 1;
      }
      @media (hover: none) {
        #stage:fullscreen #playback {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>mpeg2toh264 demo</h1>
        <p><a href="https://github.com/otya128/mpeg2toh264">https://github.com/otya128/mpeg2toh264</a></p>
        <p>MPEG-2 TSに含まれるMPEG-2をブラウザ内でH.264へ変換し再生</p>
      </header>
      <section>
        <div id="stage">
          <div id="picture">
            <video id="video" controls playsinline></video>
          </div>
          <div id="playback">
            <button id="playpause" type="button" aria-label="再生" title="再生" disabled>▶</button>
            <button id="back" type="button" disabled>10秒戻る</button>
            <button id="forward" type="button" disabled>10秒進む</button>
            <input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled
                   aria-label="再生位置" />
            <output id="time" for="seek">0:00</output>
            <label for="volume">音量</label>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" />
            <button id="mute" type="button">消音</button>
            <label for="rate">速度</label>
            <select id="rate">
              <option value="0.25">0.25倍</option>
              <option value="0.5">0.5倍</option>
              <option value="1" selected>等速</option>
              <option value="1.5">1.5倍</option>
              <option value="2">2倍</option>
            </select>
            <button id="caption-toggle" type="button" aria-pressed="true">字幕を隠す</button>
            <button id="fullscreen" type="button">全画面</button>
          </div>
        </div>
        <p>スペース/K: 再生・一時停止 ←→: 5秒 J/L: 10秒 ↑↓: 音量 M: 消音 F: 全画面</p>
      </section>
      <fieldset>
        <legend>ソース</legend>
        <form id="url-form">
          <label for="url">TSのURL</label>
          <input id="url" type="text" inputmode="url" placeholder="/video.ts または https://example.com/video.ts" required />
          <button type="submit">URLを開く</button>
        </form>
        <label for="file">TSファイル</label>
        <input id="file" type="file" accept=".ts,.m2ts,.m2t,.mts,video/mp2t" />
      </fieldset>
      <fieldset>
        <legend>設定</legend>
        <label for="placement">MediaSource</label>
        <select id="placement">
          <option value="auto">自動</option>
          <option value="worker">MSE in Workers</option>
          <option value="main">メインスレッド</option>
        </select>
        <label for="oversample">oversample</label>
        <input id="oversample" type="number" min="0.1" step="0.1" value="2" />
        <label for="recovery-interval">リカバリー間隔 (GOP数)</label>
        <input
          id="recovery-interval"
          type="number"
          min="1"
          step="1"
          value="24"
        />
        <label for="service" id="service-label" hidden>サービス</label>
        <select id="service" hidden></select>
        <ul>
          <li>
            <label>
              <input id="passthrough" type="checkbox" />
              MPEG-2のまま再生 (変換せずremux、MPEG-2を再生できるSafariなど)
            </label>
          </li>
          <li>
            <label>
              <input id="deinterlace" type="checkbox" />
              デインタレース (yadif)
            </label>
          </li>
          <li>
            <label>
              <input id="double-rate" type="checkbox" />
              フィールドごとに表示 (有効時: 59.94iなら59.94 FPS、無効時: 59.94iなら29.94 FPS)
            </label>
          </li>
          <li>
            <label>
              <input id="split-field-samples" type="checkbox" checked />
              フィールドを別サンプルに分割
              (無効にするとフレームピクチャとフィールドピクチャが混在する場合にWindows版Firefoxでは映像がフリーズしSafariではデコードエラーで再生が止まる)
            </label>
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>状態</legend>
        <p id="status"></p>
        <dl>
          <dt>入力</dt>
          <dd id="details">-</dd>
          <dt>変換</dt>
          <dd id="fps">瞬間: - トータル: -</dd>
          <dt>デコーダー判定</dt>
          <dd id="probe">判定中…</dd>
          <dt>デインタレース</dt>
          <dd id="deinterlace-stats">-</dd>
        </dl>
      </fieldset>
    </main>
    <script type="module" src="./src/demo.ts"></script>
  </body>
</html>
