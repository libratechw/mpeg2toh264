<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPEG-2 TS → H.264 MSE Player</title>
    <!-- Layout only: where things sit and how wide they are. Every control
         below is the browser's own, drawn the way the browser draws it. -->
    <style>
      #video {
        display: block;
        width: 100%;
        max-width: 100%;
      }
      #picture {
        position: relative;
        width: fit-content;
        max-width: 100%;
      }
      #playback {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5em;
      }
      #seek {
        flex: 1 1 20em;
        min-width: 0;
      }
      #playpause {
        width: 3em;
      }
      #url-form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5em;
      }
      #url {
        flex: 1 1 30em;
      }
      #stage:fullscreen {
        position: relative;
        background: black;
      }
      #stage:fullscreen > #picture {
        position: absolute;
        inset: 0;
        width: min(100vw, var(--picture-width, 177.77778vh));
        height: auto;
        margin: auto;
        aspect-ratio: var(--picture-aspect, 1.7777778);
      }
      #stage:fullscreen #picture > div {
        display: block !important;
        width: 100%;
        height: 100%;
      }
      #stage:fullscreen #video {
        width: 100%;
        height: 100%;
      }
      #stage:fullscreen #playback {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 2em 1em 1em;
        color: white;
        background: linear-gradient(transparent, rgb(0 0 0 / 80%));
        opacity: 0;
        transition: opacity 150ms ease;
      }
      #stage:fullscreen #playback:hover,
      #stage:fullscreen #playback:focus-within {
        opacity: 1;
      }
      @media (hover: none) {
        #stage:fullscreen #playback {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MPEG-2 TSをブラウザで再生</h1>
        <p>映像をH.264へ変換し、fragmented MP4としてMedia Source Extensionsへ渡します。</p>
      </header>
      <section>
        <!-- What goes fullscreen: the picture and the controls together, so
             the controls are on the screen as well.

             The element keeps its own `controls` for as long as they are any
             use. The deinterlacer covers it with a canvas, which hides them in
             the page and -- since a fullscreen browser draws media controls
             above everything -- leaves them floating over the deinterlaced
             picture on the screen, so the demo takes them away while it runs
             and gives them back when it stops. #playback works either way. -->
        <div id="stage">
          <div id="picture">
            <video id="video" controls playsinline></video>
          </div>
          <div id="playback">
            <button id="playpause" type="button" aria-label="再生" title="再生" disabled>▶</button>
            <button id="back" type="button" disabled>10秒戻る</button>
            <button id="forward" type="button" disabled>10秒進む</button>
            <input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled
                   aria-label="再生位置" />
            <output id="time" for="seek">0:00</output>
            <label for="volume">音量</label>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" />
            <button id="mute" type="button">消音</button>
            <label for="rate">速度</label>
            <select id="rate">
              <option value="0.25">0.25倍</option>
              <option value="0.5">0.5倍</option>
              <option value="1" selected>等速</option>
              <option value="1.5">1.5倍</option>
              <option value="2">2倍</option>
            </select>
            <button id="caption-toggle" type="button" aria-pressed="true">字幕を隠す</button>
            <button id="fullscreen" type="button">全画面</button>
          </div>
        </div>
        <p>キーボード: スペース／K 再生・停止 · ←→ 5秒 · J／L 10秒 · ↑↓ 音量 · M 消音 · F 全画面</p>
      </section>
      <fieldset>
        <legend>ソース</legend>
        <form id="url-form">
          <label for="url">TSのURLを指定</label>
          <input id="url" type="text" inputmode="url" placeholder="video.ts または https://example.com/video.ts" required />
          <button type="submit">URLを開く</button>
        </form>
        <label for="file">TSファイルを選択</label>
        <input id="file" type="file" accept=".ts,.m2ts,.m2t,.mts,video/mp2t" />
      </fieldset>
      <fieldset>
        <legend>設定</legend>
        <label for="placement">MediaSourceの置き場所</label>
        <select id="placement">
          <option value="auto">自動</option>
          <option value="worker">Worker（MSE in Workers）</option>
          <option value="main">メインスレッド</option>
        </select>
        <label for="service" id="service-label" hidden>サービス</label>
        <select id="service" hidden></select>
        <ul>
          <li>
            <label>
              <input id="deinterlace" type="checkbox" />
              デインタレース（yadif）
            </label>
          </li>
          <li>
            <label>
              <input id="double-rate" type="checkbox" />
              フィールドごとに表示（倍レート · yadif mode 1相当）
            </label>
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>状態</legend>
        <p id="status"></p>
        <dl>
          <dt>入力</dt>
          <dd id="details">—</dd>
          <dt>変換</dt>
          <dd id="fps">瞬間 — · トータル —</dd>
          <dt>デコーダー判定</dt>
          <dd id="probe">判定中…</dd>
          <dt>デインタレース</dt>
          <dd id="deinterlace-stats">—</dd>
        </dl>
      </fieldset>
      <p>MPEG-2映像 + AAC-LC音声 · 取得も変換もWeb Worker内で完結 · ローカルファイルはアップロードされません</p>
    </main>
    <script type="module" src="./src/demo.ts"></script>
  </body>
</html>
