<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPEG-2 TS → H.264 MSE Player</title>
  </head>
  <body>
    <main>
      <header>
        <h1>MPEG-2 TSを<br />ブラウザで再生</h1>
        <p>映像をH.264へ変換し、fragmented MP4としてMedia Source Extensionsへ渡します。</p>
      </header>
      <section>
        <video id="video" controls playsinline></video>
        <div>
          <label>
            <span>TSファイルを選択</span>
            <input id="file" type="file" accept=".ts,.m2ts,.m2t,.mts,video/mp2t" />
          </label>
          <label>
            <input id="progressive" type="checkbox" />
            <span>インターレース素材をprogressiveとして出力（ハードウェアデコードが使えるようになりますが、フィールド単位の動きベクトルが平均に丸められます）</span>
          </label>
          <div>
            <p id="status">MPEG-2 TSファイルを選択してください。</p>
            <p id="details"></p>
          </div>
        </div>
      </section>
      <p>MPEG-2映像 + AAC-LC音声 · 処理はWeb Worker内で完結 · サーバーへのアップロードなし</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
